<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d1124" />
      <stop offset="50%" stop-color="#060914" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Holographic Neon Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="goldTitan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>

    <linearGradient id="emeraldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f5ff" stroke-width="0.3" stroke-opacity="0.15" />
      <circle cx="0" cy="0" r="1" fill="#00f5ff" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .holo-text-title { font-family: 'Courier New', Courier, monospace; font-weight: 900; fill: #ffffff; letter-spacing: 6px; }
    .holo-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: #00f5ff; letter-spacing: 3px; font-size: 13px; }
    .holo-provenance { font-family: 'Courier New', monospace; font-size: 11px; fill: #ffe259; letter-spacing: 1.5px; }
    .holo-meta { font-family: monospace; font-size: 10px; fill: #8892b0; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="480" fill="url(#bgGlow)" rx="16" />
  <rect width="1200" height="480" fill="url(#cyberGrid)" rx="16" />

  <!-- Outer Cyber Border -->
  <rect x="12" y="12" width="1176" height="456" rx="12" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-opacity="0.6" filter="url(#subtleGlow)" />
  <circle cx="20" cy="20" r="3" fill="#00f5ff" />
  <circle cx="1180" cy="20" r="3" fill="#00f5ff" />
  <circle cx="20" cy="460" r="3" fill="#7000ff" />
  <circle cx="1180" cy="460" r="3" fill="#7000ff" />

  <!-- Wave Muster Pattern (Top & Bottom) -->
  <path d="M 20 60 Q 300 20 600 60 T 1180 60" fill="none" stroke="url(#neonCyan)" stroke-width="1.2" stroke-opacity="0.4" />
  <path d="M 20 70 Q 300 30 600 70 T 1180 70" fill="none" stroke="url(#emeraldShield)" stroke-width="0.8" stroke-opacity="0.3" />
  <path d="M 20 420 Q 300 460 600 420 T 1180 420" fill="none" stroke="url(#neonCyan)" stroke-width="1.2" stroke-opacity="0.4" />
  <path d="M 20 430 Q 300 470 600 430 T 1180 430" fill="none" stroke="url(#goldTitan)" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Holographic Center Nexus Rings -->
  <g transform="translate(600, 240)">
    <!-- Rotating Ring 1 -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#neonCyan)" stroke-width="1" stroke-dasharray="12 8 4 8" stroke-opacity="0.35" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#goldTitan)" stroke-width="1.2" stroke-dasharray="25 15" stroke-opacity="0.45" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#emeraldShield)" stroke-width="1.5" stroke-dasharray="40 10 10 10" stroke-opacity="0.6" filter="url(#glow)" />
    
    <!-- Central Quantum Core -->
    <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" fill="#060e24" stroke="url(#neonCyan)" stroke-width="2" filter="url(#glow)" />
    <circle cx="0" cy="0" r="16" fill="url(#goldTitan)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    
    <!-- Nexus Axis Rays -->
    <line x1="-220" y1="0" x2="-170" y2="0" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="170" y1="0" x2="220" y2="0" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="0" y1="-180" x2="0" y2="-140" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="0" y1="140" x2="0" y2="180" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.6" />
  </g>

  <!-- Title & Holographic Headers -->
  <text x="600" y="115" text-anchor="middle" class="holo-text-title" font-size="28" filter="url(#glow)">HCOS · FORINA TITAN ENGINE</text>
  <text x="600" y="145" text-anchor="middle" class="holo-sub">STATE-LEVEL SENSORY, QUANTUM CONTAINMENT &amp; RESIDUAL OS SUITE</text>

  <!-- Left Trust Badge Matrix -->
  <g transform="translate(60, 190)">
    <rect width="260" height="150" rx="8" fill="#04091a" fill-opacity="0.75" stroke="#00f5ff" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="130" y="25" text-anchor="middle" fill="#00f5ff" font-family="monospace" font-size="11" font-weight="bold">🛡️ HARDWARE ROOT-OF-TRUST</text>
    <line x1="20" y1="35" x2="240" y2="35" stroke="#00f5ff" stroke-width="0.5" stroke-opacity="0.4" />
    <text x="30" y="58" class="holo-meta">L0: TPM 2.0 / HSM / P-521</text>
    <text x="30" y="78" class="holo-meta">L1: SGX Encrypted RAM / SEV</text>
    <text x="30" y="98" class="holo-meta">L2: ML-KEM-1024 / Dilithium</text>
    <text x="30" y="118" class="holo-meta">L3: zk-SNARKs Telemetrie</text>
    <text x="30" y="136" fill="#00ff87" font-family="monospace" font-size="10">STATUS: VERIFIED &amp; ENFORCED</text>
  </g>

  <!-- Right Assurance Badge Matrix -->
  <g transform="translate(880, 190)">
    <rect width="260" height="150" rx="8" fill="#04091a" fill-opacity="0.75" stroke="#ffe259" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="130" y="25" text-anchor="middle" fill="#ffe259" font-family="monospace" font-size="11" font-weight="bold">⚡ 13-GATE ASSURANCE DAG</text>
    <line x1="20" y1="35" x2="240" y2="35" stroke="#ffe259" stroke-width="0.5" stroke-opacity="0.4" />
    <text x="30" y="58" class="holo-meta">G00-G05: Intake, Plan, Clean</text>
    <text x="30" y="78" class="holo-meta">G06: 52/52 Unittest Suite Pass</text>
    <text x="30" y="98" class="holo-meta">G07-G08: Adversarial &amp; Parity</text>
    <text x="30" y="118" class="holo-meta">G09-G12: Human, Sign, Restore</text>
    <text x="30" y="136" fill="#00ff87" font-family="monospace" font-size="10">ASSURANCE: FULL PASS (13/13)</text>
  </g>

  <!-- Bottom Provenance Banner -->
  <g transform="translate(600, 395)">
    <text x="0" y="0" text-anchor="middle" class="holo-provenance">SOUVERÄNE AUTORITÄT &amp; PROVENIENZ: DANIEL POHL · ROYAL KAISER CHARTER REGSYS</text>
    <text x="0" y="18" text-anchor="middle" class="holo-meta">PIC: 867679357 &amp; 873042778 · LEI: 894500GBJSIW8L6ET310 · EORI: AEOF139420 · UNGM: 1172700 · USt-IdNr: DE31353063511 &amp; DE441892129</text>
    <text x="0" y="32" text-anchor="middle" fill="#00f5ff" font-family="monospace" font-size="10">D-U-N-S: 315676980 &amp; 317066336 · Swiss AHV: 756.6199.0539.28 · ORCID: 0009-0004-0348-9769 · Scopus: EX2025D1143002</text>
  </g>
</svg>
