<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Flow Engine · 3D Event Network</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at center, hsl(242, 60%, 8%) 0%, hsl(252, 70%, 3%) 100%);}
  canvas{display:block;width:100vw;height:100vh;}
  .hud{
    position:fixed;left:16px;top:16px;
    font:12px/1.5 ui-monospace,monospace;
    color:rgba(255,255,255,.7);
    background:rgba(0,0,0,.4);
    padding:10px 14px;border-radius:8px;
    pointer-events:none;z-index:10;
  }
  .hud b{color:#7FE7E1;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div><b>FLOW ENGINE</b> · 3D Network</div>
  <div>Energy: <span id="energy">0.00</span></div>
  <div>Events: <span id="events">0</span></div>
  <div>Klicke für Trigger · Maus dreht</div>
</div>
<script>
(()=>{
  const P = {
    nodes: 320,
    linkDist: 110,
    attraction: 0.006,
    repulsion: 0.18,
    spiralBias: 0.35,
    palette: ["#7FE7E1","#FFFFFF","#F4C95D","#A78BFA","#67E8F9"]
  };

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const elEnergy = document.getElementById('energy');
  const elEvents = document.getElementById('events');

  let W=0, H=0, cx=0, cy=0;
  function resize(){
    W = cv.width = innerWidth * devicePixelRatio;
    H = cv.height = innerHeight * devicePixelRatio;
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    cx = W/2; cy = H/2;
  }
  addEventListener('resize', resize); resize();

  let seed = 810;
  const rnd = () => {
    seed |= 0; seed = (seed + 0x6d2b79f5)|0;
    let t = seed;
    t = Math.imul(t ^ t>>>15, t|1);
    t ^= t + Math.imul(t ^ t>>>7, t|61);
    return ((t ^ t>>>14)>>>0) / 4294967296;
  };

  // 3D Nodes
  const nodes = [];
  const radius = Math.min(W, H) * 0.32;
  for(let i=0; i<P.nodes; i++){
    const theta = rnd() * Math.PI * 2;
    const phi = Math.acos(2 * rnd() - 1);
    const r = radius * (0.4 + rnd() * 0.6);
    nodes.push({
      x: r * Math.sin(phi) * Math.cos(theta),
      y: r * Math.sin(phi) * Math.sin(theta),
      z: r * Math.cos(phi),
      vx: (rnd()-0.5)*0.4,
      vy: (rnd()-0.5)*0.4,
      vz: (rnd()-0.5)*0.4,
      c: P.palette[Math.floor(rnd()*P.palette.length)],
      r: 0.8 + rnd()*2.2,
      type: rnd() < 0.12 ? 'trigger' : 'sensor'
    });
  }

  // Sparkles (2D background)
  const sparkles = [];
  for(let i=0; i<140; i++){
    sparkles.push({
      x: rnd()*W, y: rnd()*H,
      size: 0.3+rnd()*1.2,
      life: rnd()*100,
      maxLife: 50+rnd()*70,
      vx: (rnd()-0.5)*0.25,
      vy: (rnd()-0.5)*0.25,
      hue: 190+rnd()*50
    });
  }

  let mx = cx, my = cy, mActive = false;
  let rotX = 0.3, rotY = 0.4;
  let spectralEnergy = 0.22;
  let eventCount = 0;
  let pulse = 0;

  addEventListener('mousemove', e => {
    mx = e.clientX * devicePixelRatio;
    my = e.clientY * devicePixelRatio;
    mActive = true;
    rotY = (e.clientX / innerWidth - 0.5) * 1.2;
    rotX = (e.clientY / innerHeight - 0.5) * 0.8;
  });

  addEventListener('click', () => {
    spectralEnergy = Math.min(1, spectralEnergy + 0.4);
    pulse = 1;
    eventCount++;
    elEvents.textContent = eventCount;
  });

  function project(n){
    // Simple rotation
    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

    let x = n.x * cosY - n.z * sinY;
    let z = n.x * sinY + n.z * cosY;
    let y = n.y * cosX - z * sinX;
    z = n.y * sinX + z * cosX;

    const scale = 800 / (800 + z);
    return {
      x: cx + x * scale,
      y: cy + y * scale,
      z: z,
      scale: scale
    };
  }

  function frame(){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.055)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';

    spectralEnergy *= 0.986;
    pulse *= 0.93;
    elEnergy.textContent = spectralEnergy.toFixed(2);

    // Sparkles
    for(const s of sparkles){
      s.life--;
      s.x += s.vx * (1 + spectralEnergy*0.4);
      s.y += s.vy * (1 + spectralEnergy*0.4);
      if(s.life <= 0){
        s.x = rnd()*W; s.y = rnd()*H; s.life = s.maxLife;
      }
      const alpha = Math.max(0, s.life/s.maxLife) * (0.25 + spectralEnergy*0.4);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size*devicePixelRatio, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${s.hue},75%,68%,${alpha})`;
      ctx.fill();
    }

    // Update 3D nodes
    for(const a of nodes){
      // Soft attraction to origin
      a.vx += -a.x * 0.0008;
      a.vy += -a.y * 0.0008;
      a.vz += -a.z * 0.0008;

      // Energy boost for triggers
      if(a.type === 'trigger'){
        a.vx += (rnd()-0.5) * spectralEnergy * 0.6;
        a.vy += (rnd()-0.5) * spectralEnergy * 0.6;
        a.vz += (rnd()-0.5) * spectralEnergy * 0.6;
      }

      a.vx *= 0.992; a.vy *= 0.992; a.vz *= 0.992;
      a.x += a.vx; a.y += a.vy; a.z += a.vz;
    }

    // Project and sort by depth
    const projected = nodes.map(n => ({...project(n), node: n}));
    projected.sort((a,b) => a.z - b.z);

    // Draw links (only between nearby nodes in 3D)
    const linkDist2 = P.linkDist * P.linkDist;
    for(let i=0; i<projected.length; i++){
      const a = projected[i];
      for(let j=i+1; j<projected.length; j++){
        const b = projected[j];
        const dx = a.node.x - b.node.x;
        const dy = a.node.y - b.node.y;
        const dz = a.node.z - b.node.z;
        const d2 = dx*dx + dy*dy + dz*dz;
        if(d2 < linkDist2 && d2 > 4){
          const d = Math.sqrt(d2);
          const alpha = (1 - d/P.linkDist) * 0.25 * (0.5 + spectralEnergy*0.6) * Math.min(a.scale, b.scale);
          if(alpha > 0.02){
            ctx.strokeStyle = a.node.c + Math.floor(Math.min(1,alpha+pulse*0.3)*255).toString(16).padStart(2,'0');
            ctx.lineWidth = (0.4 + spectralEnergy*0.5) * Math.min(a.scale, b.scale) * devicePixelRatio;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
    }

    // Draw nodes
    for(const p of projected){
      const size = p.node.r * p.scale * (1 + spectralEnergy*0.4 + (p.node.type==='trigger'?pulse*0.6:0));
      ctx.fillStyle = p.node.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size * devicePixelRatio, 0, Math.PI*2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
